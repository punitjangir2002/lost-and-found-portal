<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Basic SEO -->
    <title>Lost &amp; Found Portal</title>
    <meta
      name="description"
      content="A campus lost and found portal to report, search and claim items easily."
    />
    <meta name="author" content="Pj" />

    <!-- Favicon -->
    <!-- If you have favicon.svg, prefer this: -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Optional: ICO fallback (make sure favicon.ico is a real icon file) -->
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
    <!-- Optional: for mobile home-screen icon (only if you actually have this file) -->
    <!-- <link rel="apple-touch-icon" href="/favicon.png" /> -->

    <!-- Open Graph (link preview on WhatsApp, etc.) -->
    <meta property="og:title" content="Lost &amp; Found Portal" />
    <meta
      property="og:description"
      content="Your campus companion for reporting, searching and claiming lost items."
    />
    <meta property="og:type" content="website" />
    <!-- Change or remove if you don't have og-image.png yet -->
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:url" content="https://YOUR-NETLIFY-URL.netlify.app" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lost &amp; Found Portal" />
    <meta
      name="twitter:description"
      content="Your campus lost &amp; found companion."
    />
    <meta name="twitter:image" content="/og-image.png" />
  </head>

  <body>
    <!-- React will render your app here -->
    <div id="root"></div>

    <!-- Vite entry point -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
